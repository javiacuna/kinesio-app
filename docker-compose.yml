services:
  db:
    image: postgres:16
    container_name: kinesio_postgres
    environment:
      POSTGRES_DB: kinesio
      POSTGRES_USER: kinesio
      POSTGRES_PASSWORD: kinesio
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kinesio -d kinesio"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    container_name: kinesio_mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kinesio_api
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: kinesio
      DB_USER: kinesio
      DB_PASSWORD: kinesio
      DB_SSLMODE: disable
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: host=db port=5432 user=kinesio password=kinesio dbname=kinesio sslmode=disable
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase-service-account.json
      PATIENT_FILES_DIR: /app/uploads/patient-attachments
      NOTIFICATIONS_EMAIL_ENABLED: ${NOTIFICATIONS_EMAIL_ENABLED:-true}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-no-reply@kinesio.local}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Kinesio App}
    ports:
      - "8080:8080"
    volumes:
      - type: bind
        source: ${GOOGLE_APPLICATION_CREDENTIALS}
        target: /run/secrets/firebase-service-account.json
        read_only: true
      - type: bind
        source: ./uploads
        target: /app/uploads

volumes:
  db_data:
